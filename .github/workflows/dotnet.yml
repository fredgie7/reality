name: .NET 8 build and architecture checks
on:
  push:
    branches: [main, "feature/**", "refactor/**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify project boundaries and source layout
        run: python3 .github/scripts/verify_source_layout.py
      - name: Build complete solution with enforced analyzers
        run: dotnet build Reality.sln --configuration Release
      - name: Verify unused using directives
        run: dotnet format style Reality.sln --verify-no-changes --diagnostics IDE0005 --severity info --no-restore
      - name: Run smoke checks
        run: dotnet run --no-build --project tests/Reality.Tests/Reality.Tests.csproj --configuration Release
      - name: Exercise interactive console with redirected commands
        run: |
          printf 'help\nfinding Neural correlates\ntheory Physicalism\ntrace neural-content-inference\nexperiments\nreport\nquit\n' | dotnet run --no-build --project src/Reality.Console/Reality.Console.csproj --configuration Release -- --interactive > /tmp/reality-interactive.txt
          grep -q 'FINDING: Neural correlates' /tmp/reality-interactive.txt
          grep -q 'THEORY: Physicalism' /tmp/reality-interactive.txt
          grep -q 'SOURCE: https://doi.org/' /tmp/reality-interactive.txt
          grep -q 'ASSESSMENT: NotEvaluated' /tmp/reality-interactive.txt
          grep -q 'INVESTIGATION:' /tmp/reality-interactive.txt
          grep -q 'Investigation closed' /tmp/reality-interactive.txt
