name: .NET 8 build and architecture checks
on:
  push:
    branches: [main, "feature/**", "refactor/**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify project boundaries and source layout
        run: python3 .github/scripts/verify_source_layout.py
      - name: Build complete solution with enforced analyzers
        run: dotnet build Reality.sln --configuration Release
      - name: Verify unused using directives
        run: dotnet format style Reality.sln --verify-no-changes --diagnostics IDE0005 --severity info --no-restore
      - name: Run smoke checks
        run: dotnet run --no-build --project tests/Reality.Tests/Reality.Tests.csproj --configuration Release
