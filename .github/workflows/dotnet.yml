name: .NET 8 build and smoke checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify source file organization
        run: python3 .github/scripts/verify_source_layout.py
      - name: Build
        run: dotnet build src/Reality/Reality.csproj --configuration Release
      - name: Run smoke checks
        run: dotnet run --project tests/Reality.SmokeTests/Reality.SmokeTests.csproj --configuration Release
